services:
  - type: web
    name: climastance-nlp-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_ID
        value: richa3137/climate-stance-xlmr
      - key: MAX_SEQ_LENGTH
        value: "128"
